# Academic Hub — nginx vhost (drop into /etc/nginx/sites-available).
#
#   sudo cp deploy/nginx-academic.conf /etc/nginx/sites-available/academic
#   sudo ln -s /etc/nginx/sites-available/academic /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d academic.yourdomain.com
#
# client_max_body_size must be >= the server action bodySizeLimit in
# next.config.ts (100 MB) — nginx's default 1 MB would otherwise reject
# bulk PDF uploads before they reach the app.

server {
  listen 80;
  server_name academic.yourdomain.com;   # ← your subdomain

  # Bulk PDF uploads (30 files, real scans): allow large bodies.
  client_max_body_size 200m;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}