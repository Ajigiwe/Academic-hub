# Academic Hub — app + Postgres on the VPS host.
#
#   cp deploy/.env.production.example deploy/.env.production  (edit it)
#   docker compose -f deploy/docker-compose.app.yml up -d --build
#
# The app is deliberately bound to 127.0.0.1 — nginx (on the host)
# terminates TLS and reverse-proxies to it, matching your existing
# podiumclass stack. Postgres is bound to 127.0.0.1:5433 so host-side
# one-off commands (prisma migrate deploy, seed) can reach it directly
# (5433 avoids clashes with any Postgres already on the host).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pastq
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env.production}
      POSTGRES_DB: pastq
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pastq -d pastq"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Keeps the standalone process alive past slow uploads / big renders.
    environment:
      NODE_OPTIONS: "--max-old-space-size=1536"

volumes:
  pgdata: