---
deployment:
  tasks:
    # Paths for this account: cPanel clones into ~/repositories, site lives in public_html
    - export APPPATH=/home/amgacade/repositories/Academic-hub
    - export DEPLOYPATH=/home/amgacade/public_html
    # 1. Publish the web-accessible files (icons, sw.js, manifest, assets…)
    - /bin/cp -R $APPPATH/public/* $DEPLOYPATH/
    # 2. Point public_html/index.php at the app under ~/repositories (Option B layout)
    - /bin/sed -i "s|__DIR__.'/../|__DIR__.'/../repositories/Academic-hub/|g" $DEPLOYPATH/index.php
    # 3. Dependencies — this host has no composer binary, so run the vendored phar
    # (PHPBIN: prefer `php` on PATH, fall back to the alt-php 8.4 CLI this account uses)
    - /bin/sh -c 'cd $APPPATH && PHPBIN=$(command -v php || echo /opt/alt/php84/bin/php) && $PHPBIN tools/composer.phar install --no-dev --optimize-autoloader --no-interaction'
    # 4+5. Laravel caches and schema — skipped cleanly until .env is in place
    - /bin/sh -c 'if [ ! -f $APPPATH/.env ]; then echo "SKIP — no .env yet — upload it, then Deploy HEAD again"; else cd $APPPATH && PHPBIN=$(command -v php || echo /opt/alt/php84/bin/php) && $PHPBIN artisan config:cache && $PHPBIN artisan route:cache && $PHPBIN artisan view:cache && $PHPBIN artisan migrate --force; fi'
