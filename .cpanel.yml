---
deployment:
  tasks:
    # Paths for this account: app lives outside the docroot, site lives in public_html
    - export APPPATH=/home/amgacade/academic-hub
    - export DEPLOYPATH=/home/amgacade/public_html
    # 1. Publish the web-accessible files (icons, sw.js, manifest, assets…)
    - /bin/cp -R $APPPATH/public/* $DEPLOYPATH/
    # 2. Point public_html/index.php at the app two levels up (Option B layout)
    - /bin/sed -i "s|__DIR__.'/../|__DIR__.'/../academic-hub/|g" $DEPLOYPATH/index.php
    # 3. vendor/ is gitignored — install production dependencies on the server
    - composer install --no-dev --optimize-autoloader --no-interaction -d $APPPATH
    # 4+5. Laravel caches and schema — skipped cleanly until .env is in place
    - /bin/sh -c 'if [ ! -f $APPPATH/.env ]; then echo "SKIP — no .env yet — upload it, then Deploy HEAD again"; else cd $APPPATH && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force; fi'
